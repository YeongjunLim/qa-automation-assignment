name: Problem2 B마트 재고 API 테스트

on:
  push:
    branches: [main]
    paths:
      - "problem2-bmart-stock-api/**"
      - ".github/workflows/problem2-tests.yml"
  pull_request:
    paths:
      - "problem2-bmart-stock-api/**"
      - ".github/workflows/problem2-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: problem2-bmart-stock-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (TC-01~TC-25)
        run: pytest tests/ -v
